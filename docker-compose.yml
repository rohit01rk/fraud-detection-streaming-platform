version: "3.8"
services:
  zookeeper: {image: confluentinc/cp-zookeeper:7.6.0, environment: {ZOOKEEPER_CLIENT_PORT: 2181}}
  kafka: {image: confluentinc/cp-kafka:7.6.0, depends_on: [zookeeper], ports: ["9092:9092"], environment: {KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092, KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1}}
  schema-registry: {image: confluentinc/cp-schema-registry:7.6.0, depends_on: [kafka], ports: ["8081:8081"], environment: {SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092, SCHEMA_REGISTRY_HOST_NAME: schema-registry}}
  minio: {image: minio/minio:latest, ports: ["9000:9000","9001:9001"], command: server /data --console-address ":9001", environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}}
  redis: {image: redis:7-alpine, ports: ["6379:6379"]}
  producer: {build: ./producer, depends_on: [kafka], environment: {KAFKA_BOOTSTRAP: kafka:29092, TOPIC: transactions.raw}}
